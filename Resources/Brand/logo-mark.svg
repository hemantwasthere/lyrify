<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="discBody" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f4ecdb"/>
      <stop offset="100%" stop-color="#dbc9a6"/>
    </radialGradient>
  </defs>

  <!-- The rim is a filled ring, not a stroke, and a thick one: 30 units of a
       250 radius. A pale disc has no luminance contrast to spare against a
       cream page, so the edge carries the silhouette the fill used to. Checked
       by rendering at 16px rather than by eye at full size — a stroke of 14
       lands at 0.44px there and antialiases into tan mush. -->
  <circle cx="256" cy="256" r="250" fill="#3d2f1a"/>
  <circle cx="256" cy="256" r="220" fill="url(#discBody)"/>

  <!-- The groove ring moved in to clear the thicker rim. The played arc keeps
       its original 71.6-degree sweep, so the stylus dot still sits exactly on
       its head. -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="#b09a70" stroke-width="12" opacity="0.8"/>
  <circle cx="256" cy="256" r="152" fill="none" stroke="#a86419" stroke-width="18"
          stroke-dasharray="190 766" stroke-linecap="round"
          transform="rotate(-90 256 256)"/>
  <circle cx="400" cy="208" r="11" fill="#a86419"/>

  <circle cx="256" cy="256" r="52" fill="#a86419"/>
  <circle cx="256" cy="256" r="15" fill="#2b2216"/>
</svg>

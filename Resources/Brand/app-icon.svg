<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="discBody" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f4ecdb"/>
      <stop offset="100%" stop-color="#dbc9a6"/>
    </radialGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2318"/>
      <stop offset="100%" stop-color="#171208"/>
    </linearGradient>
  </defs>

  <!-- The plate stays dark, warm rather than green. A cream disc on a cream
       plate is a blob in the Dock: the disc needs something to sit against, and
       espresso is what the site's ink becomes at icon scale. -->
  <rect x="0" y="0" width="1024" height="1024" rx="226" ry="226" fill="url(#plate)"/>

  <!-- Geometry is `logo-mark.svg` scaled by 1.5, so the two cannot drift. -->
  <g transform="translate(512 512)">
    <circle cx="0" cy="0" r="375" fill="#3d2f1a"/>
    <circle cx="0" cy="0" r="330" fill="url(#discBody)"/>

    <circle cx="0" cy="0" r="228" fill="none" stroke="#b09a70" stroke-width="18" opacity="0.8"/>
    <circle cx="0" cy="0" r="228" fill="none" stroke="#a86419" stroke-width="27"
            stroke-dasharray="285 1148" stroke-linecap="round"
            transform="rotate(-90)"/>
    <circle cx="216.3" cy="-72" r="16" fill="#a86419"/>

    <circle cx="0" cy="0" r="78" fill="#a86419"/>
    <circle cx="0" cy="0" r="22" fill="#2b2216"/>
  </g>
</svg>
